[package]
name = "risbin"
version = "0.1.0"
edition = "2021"
license = "Unlicense OR MIT"

[features]
default = ["cli"]
cli = [
  "dep:anyhow",
  "dep:ignore",
  "dep:lexopt",
  "dep:path-absolutize",
]

[dependencies]
anyhow = { version = "1.0.86", optional = true }
memchr = "2.7.4"

# Output-only abspath-like formatting for --abs.
path-absolutize = { version = "3.1.1", optional = true }

# Glob semantics matching ripgrep's -g/--glob and --iglob behavior.
ignore = { version = "0.4.23", optional = true }

# BOM sniffing for file content and --files-from* streams, matching ripgrep's strategy.
encoding_rs_io = "0.1.7"

# CLI parsing (ripgrep uses lexopt); feature-gated for library-only users.
lexopt = { version = "0.3.0", optional = true }

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.2"
tempfile = "3.12.0"

[[bin]]
name = "risbin"
path = "src/main.rs"
required-features = ["cli"]
